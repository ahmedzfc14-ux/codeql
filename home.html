<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home ❤️</title>
<style>
body {
    margin:0;
    font-family:tahoma;
    background:linear-gradient(135deg,#ff9eb5,#ff4f8b);
    color:white;
    text-align:center;
    overflow-x:hidden;
}
.container {
    padding:80px 20px;
}
a {
    display:inline-block;
    margin:12px;
    background:white;
    padding:15px 25px;
    border-radius:20px;
    text-decoration:none;
    color:#ff2f72;
    font-size:18px;
    transition:0.3s;
}
a:hover {
    background:#ff2f72;
    color:white;
}
.heart {
    position:fixed;
    bottom:-20px;
    color:#fff;
    font-size:25px;
    animation:float 6s linear infinite;
    opacity:.8;
}
@keyframes float {
    0% {transform:translateY(0);}n    100% {transform:translateY(-900px); opacity:0;}
}
</style>
</head>
<body>
<div class="container">
<h1>❤️ نورتي بيتك ي مريومه ي نور عيني  ❤️</h1>
<p>
  <!-- عدل النص هنا مباشرة -->  
   💖 حبيت اعملك حاجه مختلفة كدا يروح قلبي وجمعتلك زكرياتنا الجميلة هنا يا مريومتي 💖
</p>

<!-- استخدمت مصدر صوت خارجي بدلاً من ملف محلي -->
<audio src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_1ff6fcdd1e.mp3?filename=romantic-6241.mp3" autoplay loop></audio>
<script>
setInterval(()=>{
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"%";
    h.style.fontSize=(20+Math.random()*30)+"px";
    h.style.animationDuration=(4+Math.random()*4)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),8000);
},500);
</script>
