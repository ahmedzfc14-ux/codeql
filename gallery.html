<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جاليري 📸</title>

<style>
body {
    margin:0;
    font-family:tahoma;
    background:#ff8eca;
    color:rgb(0, 0, 0);
    text-align:center;
    padding:60px 20px;
    overflow:hidden;
}

/* خلفية النجوم */
.stars{
  position:fixed;
  width:2000px;
  height:2000px;
  background:radial-gradient(rgb(255, 104, 172),transparent 2px) 0 0/3px 3px,
             radial-gradient(rgb(229, 103, 160),transparent 2px) 1.5px 1.5px/3px 3px;
  animation:moveStars 50s linear infinite;
  opacity:0.7;
}
@keyframes moveStars{
  from{transform:translateY(0);}n  to{transform:translateY(-800px);}n}

h1{
  margin-top:30px;
  font-size:30px;
}

/* I LOVE YOU */
.loveText{
  font-size:35px;
  font-weight:bold;
  color:#f40707;
  text-shadow:0 0 20px rgb(226, 12, 48);
  margin-top:5px;
}

.gallery {
    position:relative;
    z-index:5;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-top:30px;
}

.gallery img {
    width:100%;
    height:200px;
    border-radius:20px;
    object-fit:cover;
    border:3px solid rgb(248, 121, 167);
    transition:0.5s;
    cursor:pointer;
}

.gallery img:hover {
    transform:scale(1.05);
    box-shadow:0 10px 30px rgba(0,0,0,0.7);
}

a {
    display:inline-block;
    margin-top:20px;
    background:white;
    color:#ff2f72;
    padding:12px 20px;
    border-radius:15px;
    text-decoration:none;
    transition:0.3s;
    z-index:5;
    position:relative;
}

a:hover {
    background:#ff2f72;
    color:rgb(15, 7, 7);
}

/* popup */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.popup img{
    max-width:80%;
    max-height:80%;
    border-radius:25px;
    border:3px solid #1c0808;
    box-shadow:0 0 40px rgba(255,0,120,.6);
    transition:transform .2s;
}

/* arrows */
.arrow{
    position:absolute;
    top:50%;
    font-size:45px;
    color:rgb(100, 16, 16);
    cursor:pointer;
    user-select:none;
    padding:15px;
}
.left{left:30px;}
.right{right:30px;}
.arrow:hover{color:#16090f;}

/* hearts */
.heart{
    position:absolute;
    color:#ff1f7a;
    font-size:35px;
    animation:floating 1.2s linear forwards;
}
@keyframes floating{
    0%{opacity:1; transform:translateY(0);}n    100%{opacity:0; transform:translateY(-130px);}n}

/* Proposal Box */
.proposal{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  background:rgba(5, 4, 5, 0.95);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:99999;
}

.proposal h2{
  font-size:40px;
  color:#ff2f72;
  text-shadow:0 0 25px rgb(15, 13, 14);
}

.proposal button{
  margin-top:25px;
  padding:12px 25px;
  border-radius:20px;
  border:none;
  font-size:18px;
  cursor:pointer;
}

.musicBtn{
    position:fixed;
    bottom:20px;
    left:20px;
    background:white;
    color:#ff2f72;
    padding:12px 18px;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="stars"></div>

<h1>📸 أجمل لحظاتنا</h1>
<div class="loveText">I ❤️ LOVE ❤️ YOU</div>

<div class="gallery">
<!-- استخدمت روابط صور عامة من picsum.photos كبديل مؤقت -->
<img src="https://picsum.photos/seed/pic1/800/600" alt="photo1">
<img src="https://picsum.photos/seed/pic2/800/600" alt="photo2">
<img src="https://picsum.photos/seed/pic3/800/600" alt="photo3">
<img src="https://picsum.photos/seed/pic4/800/600" alt="photo4">
<img src="https://picsum.photos/seed/pic5/800/600" alt="photo5">
<img src="https://picsum.photos/seed/pic6/800/600" alt="photo6">
<img src="https://picsum.photos/seed/pic7/800/600" alt="photo7">
<img src="https://picsum.photos/seed/pic8/800/600" alt="photo8">
<img src="https://picsum.photos/seed/pic9/800/600" alt="photo9">
<img src="https://picsum.photos/seed/pic10/800/600" alt="photo10">
</div>

<a href="home.html">رجوع</a>
<a onclick="showProposal()" style="cursor:pointer">💍 مفاجأة</a>

<!-- popup -->
<div class="popup" id="popup">
  <span class="arrow left" id="prev">❮</span>
  <img id="popupImg" alt="popup image">
  <span class="arrow right" id="next">❯</span>
</div>

<!-- Proposal -->
<div class="proposal" id="proposal">
  <h2>💍  تتجوزيني ي مريم؟ 💍</h2>
  <button onclick="closeProposal()"> ❤️ نعم ❤️</button> 
   <button onclick="closeProposal()"> 🫠 لا 🫠</button> 
</div>

<button class="musicBtn" onclick="toggleMusic()">🎵 تشغيل / إيقاف</button>

<!-- استخدمت ملف صوت خارجي عام من Pixabay كبديل -->
<audio id="music" loop>
 <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_1ff6fcdd1e.mp3?filename=romantic-6241.mp3" type="audio/mpeg">
</audio>

<script>
let popup = document.getElementById("popup");
let popupImg = document.getElementById("popupImg");
let images = document.querySelectorAll(".gallery img");
let current = 0;

/* open */
function openImage(i){
  current = i;
  popup.style.display="flex";
  popupImg.src = images[current].src;
  popupImg.style.transform = "scale(1)";
  scale = 1;
}

images.forEach((img,i)=> img.onclick = ()=> openImage(i));

/* arrows */
document.getElementById("next").onclick=()=>{
  current = (current + 1) % images.length;
  openImage(current);
}

document.getElementById("prev").onclick=()=>{
  current = (current - 1 + images.length) % images.length;
  openImage(current);
}

/* close */
popup.onclick = (e)=>{
  if(e.target === popup) popup.style.display="none";
};

document.addEventListener("keydown",e=>{
  if(e.key==="Escape") popup.style.display="none";
});

/* zoom */
let scale = 1;
popupImg.addEventListener("wheel",e=>{
  e.preventDefault();
  if(e.deltaY<0) scale += 0.1;
  else scale -= 0.1;
  if(scale<0.6) scale=0.6;
  if(scale>2.5) scale=2.5;
  popupImg.style.transform=`scale(${scale})`;
});

/* hearts */
popupImg.addEventListener("click", ()=>{
  let heart = document.createElement("div");
  heart.className="heart";
  heart.innerHTML="❤";
  heart.style.left = (Math.random()*70+15)+"%";
  heart.style.top = "55%";
  popup.appendChild(heart);
  setTimeout(()=> heart.remove(),900);
});

/* music */
let music = document.getElementById("music");
function toggleMusic(){
  if(music.paused) music.play();
  else music.pause();
}

/* Proposal */
function showProposal(){
  document.getElementById("proposal").style.display="flex";
}

function closeProposal(){
  document.getElementById("proposal").style.display="none";
}
</script>

</body>
</html>
