<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ذكرياتنا 🕰️</title>
<style>
/* (نفس CSS كما في الأصلي) */
body {
    margin:0;
    font-family:tahoma;
    color:white;
    text-align:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ffb3c6,#ff4f8b);
    animation:bgColors 60s ease-in-out infinite;
}
@keyframes bgColors{0%{background:linear-gradient(135deg,#ffb3c6,#ff4f8b);}50%{background:linear-gradient(135deg,#ffc8a2,#ff6f91);}100%{background:linear-gradient(135deg,#ffb3c6,#ff4f8b);}}
.stars{position:fixed;width:2000px;height:2000px;background:radial-gradient(white,transparent 2px) 0 0/3px 3px,radial-gradient(white,transparent 2px) 1.5px 1.5px/3px 3px;animation:moveStars 50s linear infinite;opacity:0.7}
@keyframes moveStars{from{transform:translateY(0);}to{transform:translateY(-800px);}}
.rose{position:fixed;top:-50px;font-size:30px;animation:fall 6s linear infinite;}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}

h1{font-size:32px;color:#ff2f72;text-shadow:0 0 25px pink}
.box{max-width:700px;margin:auto;background:rgba(255,255,255,0.2);padding:30px;border-radius:25px;position:relative;z-index:5}
.memory{background:white;color:#ff2f72;padding:15px;border-radius:15px;margin:15px 0;font-size:18px;transition:0.3s;cursor:pointer}
.memory:hover{transform:scale(1.03);box-shadow:0 10px 25px rgba(0,0,0,0.2)}
a{display:inline-block;margin-top:20px;padding:12px 20px;background:white;color:#ff2f72;border-radius:15px;text-decoration:none;transition:0.3s;position:relative;z-index:5}a:hover{background:#ff2f72;color:white}
.popupMemory{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:9999}
.popupContent{position:relative;width:400px;height:400px;background:#ff2f72;transform:rotate(-45deg);border-radius:50% 50% 50% 50%;display:flex;justify-content:center;align-items:center;color:white;padding:20px;text-align:center;font-size:20px;cursor:grab;transition:transform 0.3s ease}
.popupContent p{transform:rotate(45deg);margin:0}
.closeBtn{position:absolute;top:10px;left:15px;font-size:25px;cursor:pointer;color:white}
.popupHeart{position:absolute;font-size:30px;color:white;animation:floatHeart 1.2s linear forwards}@keyframes floatHeart{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-100px);}}
</style>
</head>
<body>
<div class="stars"></div>

<h1>🕰️ ذكرياتنا الجميلة</h1>
<div class="box">
  <div class="memory" data-text="📍❤️أول مرة اتكلمنا كانت يوم 24/8/2024 كان اجمل يوم في حياتي يوم م ربنا جمعني بيكي صدفة❤️">📍❤️ أول مرة اتكلمنا ❤️</div>
    <div class="memory" data-text="🫂🫶💗 يوم 28/8/2024 يوم حبنا الابدي🫶💗🫂"> ✨اليوم اللي حسينا فيه اننا حبنا بعض واعترفنا فيه✨</div>

  <div class="memory" data-text="📍🫶يوم 18/9/2024 كنتي فيه زي القمر يروحي كانت الساعه 7:32 دقيقة 🫶 ">📍💗اليوم اللي شوفنا بعض فيه لاول مره💗</div>


  <div class="memory" data-text="📍💕يوم م كنا مع بعض سوا كان اجمل يوم 💕">📍 اجمل يوم قضيناه 💕</div>
</div>
<a href="home.html">رجوع</a>

<!-- نافذة قلب منبثق -->
<div class="popupMemory" id="popupMemory">
  <div class="popupContent" id="popupContent">
    <span class="closeBtn" id="closePopup">&times;</span>
    <p id="popupText"></p>
  </div>
</div>

<!-- موسيقى (مصدر خارجي بديل) -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_1ff6fcdd1e.mp3?filename=romantic-6241.mp3" type="audio/mpeg">
</audio>
<button onclick="toggleMusic()" style="position:fixed;bottom:20px;left:20px;padding:10px 15px;border-radius:15px;border:none;background:white;color:#ff2f72;cursor:pointer;z-index:5;">🎵 تشغيل / إيقاف</button>

<script>
// موسيقى
let music=document.getElementById("music");
function toggleMusic(){music.paused?music.play():music.pause();}

// ورود متساقطة
setInterval(()=>{
 let rose=document.createElement("div");
 rose.className="rose";
 rose.innerHTML="🌹";
 rose.style.left=Math.random()*100+"vw";
 rose.style.animationDuration=(Math.random()*3+4)+"s";
 document.body.appendChild(rose);
 setTimeout(()=>rose.remove(),7000);
},700);

// popup لكل ذكرى مع قلب متحرك
const memories = document.querySelectorAll(".memory");
const popupMemory = document.getElementById("popupMemory");
const popupText = document.getElementById("popupText");
const popupContent = document.getElementById("popupContent");
const closePopup = document.getElementById("closePopup");

memories.forEach(mem=>{
  mem.addEventListener("click", ()=>{
    popupText.innerText = mem.dataset.text;
    popupMemory.style.display = "flex";

    // قلب يظهر عند فتح النافذة
    let heart = document.createElement("div");
    heart.className = "popupHeart";
    heart.style.left = (window.innerWidth/2 - 15) + "px";
    heart.style.top = (window.innerHeight/2 - 15) + "px";
    heart.innerHTML = "❤";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),1200);
  });
});

// اغلاق
closePopup.addEventListener("click", ()=>{
  popupMemory.style.display = "none";
});
popupMemory.addEventListener("click", (e)=>{
  if(e.target === popupMemory) popupMemory.style.display = "none";
});

// تكبير وتصغير القلب بالماوس
let scale=1;
popupContent.addEventListener("wheel", e=>{
  e.preventDefault();
  scale += e.deltaY<0?0.1:-0.1;
  if(scale<0.5) scale=0.5;
  if(scale>2) scale=2;
  popupContent.style.transform = `rotate(-45deg) scale(${scale})`;
});
</script>
</body>
</html>
